name: CI

on:
  push:
    branches: [ main, lab5 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: rm -f package-lock.json
      - run: npm install
      - run: npm run type-check
      - run: npm test
      - run: npm run build